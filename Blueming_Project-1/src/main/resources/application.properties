spring.application.name=Blueming_Project-1

server.servlet.context-path=/blueming
server.port=8006

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# 오라클과 MyBatis 라이브러리가 연동 된 후에는 반드시 application.properties 파일에
# 해당 연동 설정 구문까지 같이 작성해야만 한다!! (안그러면 오류남)

# 오라클 연동 구문
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=SEMI
spring.datasource.password=SEMI

# 마이바티스 연동 구문
# mybatis.config-location=classpath:mybatis-config.xml
# mybatis.mapper-locations=classpath:mappers/*.xml
# classpath: 은 소스폴더인 src/main/resouces 폴더를 의미한다.

# 파일업로드 관련 설정 구문
# spring.servlet.multipart.max-file-size=10MB
# 파일 한개의 최대 용량 지정 (10MB)
# spring.servlet.multipart.max-request-size=10MB